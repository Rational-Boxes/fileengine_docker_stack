[project]
name = "fileengine-bcf-service"
version = "0.1.0"
description = "FileEngine BCF (BIM Collaboration Format) API subservice — the openBIM issue door over the discussion store + core file store"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "James Hickman", email = "james@rationalboxes.com"}]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "grpcio>=1.50",
    "protobuf>=4.21",
]
# Per XEOKIT_UPGRADE_MARKUP_BCF_PLAN.md §12: this service is a BCF protocol/format
# door, an adapter over the discussion store + core file store — NOT a second issue
# database. Thread/comment writes go through the shared `comment_store` interface
# (to be extracted from the discussion service); this service owns only the BCF
# projection tables (bcf_project / bcf_topic / bcf_viewpoint / bcf_guid map).

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "httpx>=0.27"]

[project.scripts]
bcf-service = "bcf_service.app:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
