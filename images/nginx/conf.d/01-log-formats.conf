# Log formats. http-context; loaded before the vhosts.
#
# `combined_noquery` is the standard combined format with ONE change: it logs
# $uri (the path) instead of $request (method + full URI + protocol), so the
# query string never reaches the log.
#
# It exists for the share-link public routes. A recipient has no account and no
# session, so their credential — the link secret, and the redemption id — has to
# travel in the URL: a browser NAVIGATION cannot set a header, and the download
# must be a plain navigation or it would be buffered into memory instead of
# streamed to disk.
#
# That makes the query string bearer material. Logging it would leave working
# credentials in a file with a longer life and a wider readership than the link
# itself, and log shipping would carry them further still. The path alone still
# gives operators the route, the status and the byte count.
log_format combined_noquery
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
