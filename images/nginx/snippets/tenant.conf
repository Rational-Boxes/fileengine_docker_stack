# Tenant SPA + same-origin APIs (included by the per-tenant <tenant>.<base> server).
# The Host header is passed through so the bridges/CSAI/MCP resolve the tenant
# from the subdomain.
root /usr/share/nginx/html;

# Monitoring endpoints are NOT public.
#
# Every service below now exposes the unauthenticated monitoring set (/healthz,
# /readyz, /poolz, /metrics) on its own port — Prometheus cannot present a bearer
# token, so those routes have to skip authentication. Each proxy prefix here would
# otherwise republish them: /csai/metrics, /discuss/metrics, /diff/metrics,
# /mcp/metrics and so on all reach the service's real endpoint, handing out thread
# counts, queue depths, memory and build versions to anyone who asks.
#
# The services carry their own FILEENGINE_MONITORING_ALLOW_IPS guard, but it is
# opt-in and unset in this stack, so it is inert by default. This is the control
# that does not depend on remembering to configure it.
#
# A regex location wins over the prefix locations below, so this applies to them
# all. 404 rather than 403 so the block does not confirm the path exists.
# Scrapers reach the services directly on the compose network and are unaffected.
location ~ ^/(api|csai|discuss|mcp|folder-actions|diff|ldapadmin|share|bcf)/(healthz|readyz|poolz|metrics)/?$ {
    access_log off;
    return 404;
}

# REST bridge (auth, files, streaming up/down + range).
location /api/ {
    proxy_pass http://http-bridge:8090/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;   # stream uploads straight through
    proxy_buffering off;           # stream / range downloads straight through
}

# CSAI (search, document text/preview, RAG chat WebSocket).
location /csai/ {
    proxy_pass http://csai-app:8092/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;   # WebSocket /csai/chat
    proxy_buffering off;
}

# Discussion (document-anchored threaded comments, dashboard attention/activity
# feeds, review flags). The SPA calls /discuss/*; the live co-viewing/comment-sync
# WebSocket at /discuss/files/{uid}/live needs the Upgrade passthrough.
location /discuss/ {
    proxy_pass http://discussion:8094/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;   # WebSocket /discuss/files/{uid}/live
    proxy_buffering off;
}

# MCP: the Streamable-HTTP endpoint at /mcp; helper routes (/auth/token,
# /whoami) under /mcp/. Host passed through for subdomain tenant resolution.
location = /mcp { proxy_pass http://mcp:8089/mcp; proxy_set_header Host $host; }
location /mcp/  { proxy_pass http://mcp:8089/;    proxy_set_header Host $host; }

# folder_actions (admin surface: folder action bindings, action-type discovery,
# sorter routes, classifier editor, run log). The SPA calls /folder-actions/*.
location /folder-actions/ {
    proxy_pass http://folder-actions:8099/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# difference_service (version-to-version comparison). The SPA calls /diff/* —
# manifests, and the diff renditions the unified viewer opens.
#
# The long read timeout is the point of this block: a first-time comparison of a
# large drawing or model is built on demand and can take well over the default
# 60s, which would otherwise surface as a 504 on exactly the files that most need
# comparing. proxy_buffering is off so a large merged XKT streams rather than
# being spooled to disk first.
location /diff/ {
    proxy_pass http://difference:8100/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_buffering off;
}

# BCF (openBIM issues): the BCF-API desktop BIM issue managers speak, and the
# BCF-XML (.bcfzip) import/export the SPA's markup view calls.
#
# NOTE THE MISSING TRAILING SLASH ON proxy_pass. Every other service here strips
# its prefix (`proxy_pass http://difference:8100/;`) because its routes live at
# the root. bcf_service mounts its routers at `/bcf` ALREADY, so the prefix must
# be PRESERVED — adding a `/` here rewrites /bcf/2.1/bcf-xml/export to
# /2.1/bcf-xml/export and every BCF call 404s.
location /bcf/ {
    proxy_pass http://bcf:8098;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Import takes a whole .bcfzip upload and export streams one back; a federated
    # model's issue set with snapshots is comfortably past any default cap.
    client_max_body_size 0;
    proxy_buffering off;
    proxy_read_timeout 300s;
}

# LDAP Manager (tenant user/role admin, self-service profile/password, invite/
# reset). X-Forwarded-For/X-Real-IP passed so per-IP reset rate-limiting sees the
# real client, not nginx.
# share_service. Two things reach it, and only one is authenticated:
#
#   /share/v1/...        the API — owner-side routes need a bearer, and the
#                        /share/v1/public/... routes deliberately need nothing,
#                        because a recipient has no account.
#   /s/<token>           the landing page itself is SPA-served, so it falls
#                        through to the try_files rule below. No rule needed.
#
# NOTE the trailing prefix is NOT stripped (proxy_pass has no trailing path):
# the service mounts its routers under /share/v1 itself, so rewriting here would
# 404 everything.
location /share/ {
    proxy_pass http://share:8101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A folder share streams a zip64 assembled on the fly and a drop streams
    # in; neither is buffered here, or nginx would spool multi-GB bodies to
    # disk and defeat the streaming the whole path was built for.
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# The recipient's credential travels in the query string on the content route,
# because a browser NAVIGATION cannot set a header. Keep it out of the access
# log: $uri is the path WITHOUT the query, unlike $request.
location /share/v1/public/ {
    access_log /var/log/nginx/access.log combined_noquery;
    proxy_pass http://share:8101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    client_max_body_size 0;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /ldapadmin/ {
    proxy_pass http://ldap-manager:8093/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# SPA (history-mode fallback).
# The recipient landing page. SPA-served like everything else — this exists
# ONLY to keep the link secret out of the access log; see share_landing in
# conf.d/01-log-formats.conf. A regex location, so it wins over `location /`.
# `[.]` rather than an escaped dot: a backslash inside an nginx quoted
# string is passed through to the regex, so "\\." matched a literal
# BACKSLASH and this location silently never fired — the secret kept
# going to the log with nothing to show anything was wrong.
location ~ "^/s/(?<share_link_uid>[0-9a-fA-F-]{36})[.]" {
    access_log /var/log/nginx/access.log share_landing;
    # Serves index.html DIRECTLY rather than `try_files ... /index.html`.
    #
    # try_files with a URI as its last argument performs an internal redirect,
    # and nginx logs using the configuration of the location a request ENDS UP
    # in — so the redirect handed logging back to `location /` and this
    # access_log never applied. The secret kept reaching the log while the
    # config looked correct, which is the hard kind of wrong.
    #
    # `=404` as the fallback keeps /index.html a FILE lookup, so the request is
    # served here and logged here.
    try_files /index.html =404;
}

location / { try_files $uri $uri/ /index.html; }
