# The media origin: <tenant>-media.<base> (MEDIA_SHARE.md §6.5).
#
# The ONE origin in the platform that answers with a real media type, so it
# serves nothing else: no SPA, no /api, no cookie, no authenticated route —
# /media/v1/ to share_service and a 404 for every other path. share_service
# sets the security headers itself (inline, nosniff, CSP, the MIME allowlist);
# nothing here may weaken them.

# The viewer's session token travels in the query string (a <video> cannot send
# a header), so the access log carries the path only.
access_log /var/log/nginx/access.log combined_noquery;

location ^~ /media/v1/ {
    # Flood control per client IP (§6.9 "Flood"): generous enough for a player
    # buffering and seeking, tight enough that a script notices. The byte,
    # concurrency and tenant windows are share_service's.
    limit_req  zone=fe_media_req burst=60 nodelay;
    limit_req_status  429;

    proxy_pass http://share:8101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Stream ranges straight through; never spool a rendition to disk here.
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 16k;          # JSON control calls only
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Concurrency capped on the byte streams only, as a coarse per-IP backstop
    # (share_service holds the real per-viewer/link limits). At 8 over every
    # route, HTTP/2 counted the page's control calls beside a player's open
    # ranges and a reopened link got 429 on its peek (production 2026-10-04).
    location ~ ^/media/v1/[^/]+/(content|download)$ {
        limit_conn fe_media_conn 32;
        limit_conn_status 429;
        proxy_pass http://share:8101;
    }
}

location / { return 404; }
