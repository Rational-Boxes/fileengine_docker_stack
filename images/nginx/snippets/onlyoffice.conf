# ONLYOFFICE Document Server — served at docs.<base> (included by that server).
# In-browser office editing (Phase 1.7): the SPA loads the editor's api.js from
# here, and the editor keeps a WebSocket open for co-editing/autosave. The Doc
# Server itself reaches CSAI over the internal network (csai-app:8092), not here.
location / {
    proxy_pass http://onlyoffice;            # Document Server listens on :80

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;   # editor WebSocket (map in conf.d/00-websocket-map.conf)

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;        # DS must know the public scheme is https
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
