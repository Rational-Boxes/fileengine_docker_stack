# Unified FileEngine stack.
#
# Phase 2 brings up the data layer — Postgres (pgvector) + Redis — the one-shot
# db-init, and the core gRPC service to verify it boots against them. Later
# phases append the bridges, CSAI, MCP, and nginx.
#
# The object store is EXTERNAL S3 (S3_* in .env). For local testing without an
# external bucket, add the test override (provides a MinIO):
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up
#
# Only nginx (a later phase) publishes host ports; the data services and the core
# stay internal to the compose network. Config is the operator .env, mapped to
# per-service environment below.

name: fileengine

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CORE_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # One-shot: create the CSAI database + DB-wide extensions (idempotent). The
  # core DB is created by the postgres image; the core/CSAI provision their own
  # per-tenant schemas on demand.
  db-init:
    image: pgvector/pgvector:pg16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORE_DB: ${CORE_DB}
      CSAI_DB: ${CSAI_DB}
      DISC_DB: ${DISC_DB:-discussion}
      FA_DB: ${FA_DB:-folder_actions}
      SHARE_DB: ${SHARE_DB:-share_service}
    volumes:
      - ./init/db-init.sh:/db-init.sh:ro,Z
      - ./init/migrations:/migrations:ro,Z
    entrypoint: ["bash", "/db-init.sh"]
    restart: "no"

  # 389 Directory Server — authentication + tenant/role groups. Internal only
  # (LDAP 3389, LDAPS 3636). Built on Fedora so it carries the OFFICIAL Cockpit
  # console (cockpit-389-ds); the console is served on :9090 when
  # COCKPIT_ADMIN_PASSWORD is set and reverse-proxied by nginx at ldap-admin.<base>
  # (enable with ENABLE_LDAP_ADMIN=1). Same dscontainer init + /data layout as the
  # upstream image.
  ldap:
    build:
      context: .
      dockerfile: images/ldap/Dockerfile
    image: fileengine-ldap:${VERSION:-1.7.1}
    environment:
      DS_DM_PASSWORD: ${LDAP_BIND_PASSWORD}
      DS_SUFFIX_NAME: ${LDAP_DOMAIN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      # Cockpit console login (PAM/root). Unset → console not started.
      COCKPIT_ADMIN_PASSWORD: ${COCKPIT_ADMIN_PASSWORD:-}
      BASE_DOMAIN: ${BASE_DOMAIN}
    volumes:
      - ldapdata:/data
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -H ldap://localhost:3389 -x -D 'cn=Directory Manager' -w \"$$LDAP_BIND_PASSWORD\" -b cn=config -s base dn >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  # One-shot: create the suffix backend + seed the DIT (ou=users, ou=tenants,
  # default tenant role groups, initial admin). Idempotent.
  ldap-init:
    image: 389ds/dirsrv:latest
    depends_on:
      ldap:
        condition: service_healthy
    environment:
      LDAP_URI: ldap://ldap:3389
      LDAP_SUFFIX: ${LDAP_DOMAIN}
      LDAP_BIND_DN: ${LDAP_BIND_DN:-cn=Directory Manager}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      DEFAULT_TENANT: ${DEFAULT_TENANT:-default}
      LDAP_ADMIN_EMAIL: ${LDAP_ADMIN_EMAIL}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD}
    volumes:
      - ./init/ldap-seed.sh:/ldap-seed.sh:ro,Z
    entrypoint: ["bash", "/ldap-seed.sh"]
    restart: "no"

  core:
    image: fileengine-core:${VERSION:-1.7.1}
    build:
      context: .
      dockerfile: images/core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      # --- Database ---
      FILEENGINE_PG_HOST: ${POSTGRES_HOST:-postgres}
      FILEENGINE_PG_PORT: "${POSTGRES_PORT:-5432}"
      FILEENGINE_PG_DATABASE: ${CORE_DB}
      FILEENGINE_PG_USER: ${POSTGRES_USER}
      FILEENGINE_PG_PASSWORD: ${POSTGRES_PASSWORD}
      # --- Local storage / cache tier ---
      FILEENGINE_STORAGE_BASE: /var/lib/fileengine/storage
      # --- At-rest crypto ---
      FILEENGINE_ENCRYPT_DATA: ${FILEENGINE_ENCRYPT_DATA:-true}
      FILEENGINE_COMPRESS_DATA: ${FILEENGINE_COMPRESS_DATA:-true}
      AT_REST_KEY: ${AT_REST_KEY}
      # --- Object store (external S3; overridden to MinIO by the test override) ---
      FILEENGINE_S3_ENDPOINT: ${S3_ENDPOINT}
      FILEENGINE_S3_REGION: ${S3_REGION}
      FILEENGINE_S3_BUCKET: ${S3_BUCKET}
      FILEENGINE_S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      FILEENGINE_S3_SECRET_KEY: ${S3_SECRET_KEY}
      FILEENGINE_S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      FILEENGINE_S3_SYNC_SUPPORT: ${S3_SYNC_SUPPORT:-aws}
      FILEENGINE_S3_RETRY_SECONDS: "${S3_RETRY_SECONDS:-60}"
      FILEENGINE_S3_SYNC_ON_STARTUP: ${S3_SYNC_ON_STARTUP:-true}
      # --- Redis events (the packaged core is built with events ON) ---
      FILEENGINE_EVENTS_ENABLED: "true"
      FILEENGINE_REDIS_HOST: redis
      FILEENGINE_REDIS_PORT: "6379"
      FILEENGINE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      FILEENGINE_EVENTS_STREAM: ${EVENTS_STREAM:-fileengine:events}
    volumes:
      - filecache:/var/lib/fileengine/storage
    healthcheck:
      # The metrics listener (:8081) comes up once the core is serving. No curl in
      # the image, so probe the TCP port with bash.
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8081' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  # REST/auth proxy over the gRPC core (serves the SPA's /api). Internal only;
  # nginx (a later phase) terminates TLS and reverse-proxies to it.
  http-bridge:
    image: fileengine-http-bridge:${VERSION:-1.7.1}
    build:
      context: .
      dockerfile: images/http-bridge/Dockerfile
    depends_on:
      core:
        condition: service_healthy
      ldap-init:
        condition: service_completed_successfully
    environment:
      FILEENGINE_GRPC_HOST: core
      FILEENGINE_GRPC_PORT: "50051"
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8090"
      HTTP_MONITORING_PORT: "8091"
      HTTP_CORS_ORIGIN: ${HTTP_CORS_ORIGIN:-}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-104857600}
      LOG_WRITE_TO_CONSOLE: "true"
      # LDAP is contacted per-login; the bridge starts even before LDAP is up
      # (Phase 4). /readyz probes the core via gRPC and needs no LDAP.
      FILEENGINE_LDAP_ENDPOINT: ${LDAP_ENDPOINT:-ldap://ldap:3389}
      FILEENGINE_LDAP_DOMAIN: ${LDAP_DOMAIN:-}
      FILEENGINE_LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      FILEENGINE_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      FILEENGINE_LDAP_TENANT_BASE: ${LDAP_TENANT_BASE:-}
      FILEENGINE_LDAP_USER_BASE: ${LDAP_USER_BASE:-}
      # Bearer session tokens are signed HS256 JWTs. This secret MUST match every
      # service that verifies them (csai, ldap-manager). Short TTL + client refresh
      # (POST /v1/auth/refresh) keeps enforced roles close to LDAP.
      FILEENGINE_JWT_SECRET: ${FILEENGINE_JWT_SECRET:?set FILEENGINE_JWT_SECRET (see .env.example)}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-900}
      DOWNLOAD_TICKET_TTL_SECONDS: ${DOWNLOAD_TICKET_TTL_SECONDS:-30}

      # --- the shared sign-in origin ------------------------------------
      # A reserved DNS label that never resolves to a tenant. Every tenant
      # subdomain sends a signed-out visitor to <LOGIN_SUBDOMAIN>.<base>, which
      # authenticates once and hands the session back — so OAuth returns to ONE
      # origin and OAUTH_RETURN_ALLOWLIST needs a single entry however many
      # tenants exist.
      #
      # Configurable because a deployment may be unable to reserve "login" on
      # its domain. It must contain no hyphen: the <tenant>-<interface>
      # convention would split it, and nginx's tenant vhost regex excludes one
      # anyway. The SPA reads this value from the bridge at run time, so a
      # prebuilt image picks it up without a rebuild.
      LOGIN_SUBDOMAIN: ${LOGIN_SUBDOMAIN:-login}

      # --- OAuth2 / OIDC login (optional) --------------------------------
      # Empty OAUTH_PROVIDERS disables federated login entirely, and the SPA
      # then shows no provider buttons at all — it asks the bridge what is
      # configured rather than guessing. See http_bridge/OAUTH_SETUP.md.
      OAUTH_PROVIDERS: ${OAUTH_PROVIDERS:-}
      # This bridge's public base URL. Every provider's callback is
      # <base>/v1/auth/oauth/<provider>/callback, and nginx path-proxies /api
      # on every host — so the sign-in origin is the natural choice, and it is
      # the ONE redirect URI to register with each IdP.
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-https://${LOGIN_SUBDOMAIN:-login}.${BASE_DOMAIN}/api}
      # Where a completed sign-in may return to. With the shared origin this is
      # one entry, not one per tenant. NEVER shorten it to a bare scheme:
      # "https://" ends on a boundary and matches every URL, turning this into
      # the open redirect it exists to prevent.
      OAUTH_RETURN_ALLOWLIST: ${OAUTH_RETURN_ALLOWLIST:-https://${LOGIN_SUBDOMAIN:-login}.${BASE_DOMAIN}/}
      # Per-provider credentials. Endpoints are built in for these three, so a
      # client id and secret is all each needs (Microsoft also takes a tenant).
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_CLIENT_ID: ${OAUTH_MICROSOFT_CLIENT_ID:-}
      OAUTH_MICROSOFT_CLIENT_SECRET: ${OAUTH_MICROSOFT_CLIENT_SECRET:-}
      OAUTH_MICROSOFT_TENANT: ${OAUTH_MICROSOFT_TENANT:-common}
      OAUTH_LINKEDIN_CLIENT_ID: ${OAUTH_LINKEDIN_CLIENT_ID:-}
      OAUTH_LINKEDIN_CLIENT_SECRET: ${OAUTH_LINKEDIN_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8090' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # WebDAV gateway over the gRPC core. Internal only; nginx routes the
  # <tenant>-drive.<base> vhost here.
  webdav-bridge:
    image: fileengine-webdav-bridge:${VERSION:-1.7.1}
    build:
      context: .
      dockerfile: images/webdav-bridge/Dockerfile
    depends_on:
      core:
        condition: service_healthy
      ldap-init:
        condition: service_completed_successfully
    environment:
      FILEENGINE_GRPC_HOST: core
      FILEENGINE_GRPC_PORT: "50051"
      WEBDAV_HOST: 0.0.0.0
      WEBDAV_PORT: "8088"
      WEBDAV_MONITORING_PORT: "8089"
      LOG_WRITE_TO_CONSOLE: "true"
      FILEENGINE_LDAP_ENDPOINT: ${LDAP_ENDPOINT:-ldap://ldap:3389}
      FILEENGINE_LDAP_DOMAIN: ${LDAP_DOMAIN:-}
      FILEENGINE_LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      FILEENGINE_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      FILEENGINE_LDAP_TENANT_BASE: ${LDAP_TENANT_BASE:-}
      FILEENGINE_LDAP_USER_BASE: ${LDAP_USER_BASE:-}
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/localhost/8088' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Bundled local AI (CPU) — serves the embedding model for CSAI.
  ollama:
    image: ollama/ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  # One-shot: pull the embedding model on first startup (idempotent — Ollama
  # no-ops if it's already in the persisted volume).
  ollama-init:
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      CSAI_EMBEDDING_MODEL: ${CSAI_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint:
      - /bin/sh
      - -c
      - 'ollama pull "$$CSAI_EMBEDDING_MODEL" && echo "model $$CSAI_EMBEDDING_MODEL ready"'
    restart: "no"

  # CSAI HTTP app — search, RAG chat, document text/preview (serves the SPA /csai).
  csai-app:
    image: fileengine-csai:${VERSION:-1.7.1}
    build:
      context: images/csai
      dockerfile: Dockerfile
      args:
        INSTALL_DOCLING: ${INSTALL_DOCLING:-1}
    depends_on:
      core:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ldap-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
      onlyoffice:
        condition: service_started
    environment: &csai-env
      CSAI_HTTP_HOST: 0.0.0.0
      CSAI_HTTP_PORT: "8092"
      CSAI_CORS_ORIGINS: ${CSAI_CORS_ORIGINS:-}
      # Accept the bridge's bearer token (introspected at /v1/auth/introspect) so
      # the SPA's single login also authenticates chat/search here. REQUIRED for
      # the frontend — without it the SPA reuses its bridge token and CSAI rejects
      # it with "authentication required" (the /chat WebSocket closes 4401).
      CSAI_BRIDGE_URL: http://http-bridge:8090
      # Verify the bridge's signed bearer JWTs locally (no introspection round-trip);
      # must match the bridge's FILEENGINE_JWT_SECRET.
      FILEENGINE_JWT_SECRET: ${FILEENGINE_JWT_SECRET:?set FILEENGINE_JWT_SECRET (see .env.example)}
      FILEENGINE_GRPC_HOST: core
      FILEENGINE_GRPC_PORT: "50051"
      FILEENGINE_CSAI_TENANT: ${DEFAULT_TENANT:-default}
      FILEENGINE_CSAI_USER: ${LDAP_ADMIN_EMAIL}
      FILEENGINE_CSAI_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      FILEENGINE_LDAP_ENDPOINT: ${LDAP_ENDPOINT}
      FILEENGINE_LDAP_DOMAIN: ${LDAP_DOMAIN}
      FILEENGINE_LDAP_BIND_DN: ${LDAP_BIND_DN}
      FILEENGINE_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      FILEENGINE_LDAP_TENANT_BASE: ${LDAP_TENANT_BASE}
      FILEENGINE_LDAP_USER_BASE: ${LDAP_USER_BASE}
      CSAI_PG_HOST: ${POSTGRES_HOST:-postgres}
      CSAI_PG_PORT: "${POSTGRES_PORT:-5432}"
      CSAI_PG_DATABASE: ${CSAI_DB}
      CSAI_PG_USER: ${POSTGRES_USER}
      CSAI_PG_PASSWORD: ${POSTGRES_PASSWORD}
      FILEENGINE_REDIS_HOST: redis
      FILEENGINE_REDIS_PORT: "6379"
      FILEENGINE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      FILEENGINE_EVENTS_STREAM: ${EVENTS_STREAM:-fileengine:events}
      # AI providers (independent): embeddings on bundled CPU Ollama, chat external.
      CSAI_EMBEDDING_PROVIDER: ${CSAI_EMBEDDING_PROVIDER:-ollama}
      CSAI_EMBEDDING_MODEL: ${CSAI_EMBEDDING_MODEL:-nomic-embed-text}
      CSAI_EMBEDDING_BASE_URL: ${CSAI_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      CSAI_EMBEDDING_DIMENSION: ${CSAI_EMBEDDING_DIMENSION:-768}
      CSAI_CHAT_PROVIDER: ${CSAI_CHAT_PROVIDER:-anthropic}
      CSAI_CHAT_MODEL: ${CSAI_CHAT_MODEL:-claude-sonnet-4-6}
      CSAI_CHAT_BASE_URL: ${CSAI_CHAT_BASE_URL:-}
      CSAI_CHAT_API_KEY: ${CSAI_CHAT_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Web search tool — when enabled (and the chat provider supports tools) the
      # model may call web_search to answer from the live web alongside documents.
      CSAI_WEB_SEARCH_ENABLED: ${CSAI_WEB_SEARCH_ENABLED:-false}
      CSAI_WEB_SEARCH_DEFAULT: ${CSAI_WEB_SEARCH_DEFAULT:-false}
      CSAI_WEB_SEARCH_PROVIDER: ${CSAI_WEB_SEARCH_PROVIDER:-duckduckgo}
      CSAI_WEB_SEARCH_RESULTS: ${CSAI_WEB_SEARCH_RESULTS:-5}
      CSAI_WEB_MAX_ITERATIONS: ${CSAI_WEB_MAX_ITERATIONS:-3}
      # Indexing reads ALL content (system_admin bypass) so the vector index is
      # complete; per-user ACLs are enforced at retrieval time. Leave on.
      CSAI_INDEX_BYPASS_ACL: ${CSAI_INDEX_BYPASS_ACL:-true}
      # ONLYOFFICE in-browser editing (Phase 1.7) — the Document Server is stood up
      # by the `onlyoffice` service below. DOCSERVER_URL is browser-facing (loads
      # api.js over the same TLS as the SPA, via the nginx docs.<base> vhost);
      # CALLBACK_BASE is how the Doc Server reaches CSAI *from inside the compose
      # network* for document download + save callback (internal DNS, no TLS).
      # JWT_SECRET must match the Doc Server's JWT_SECRET. The scoped download/
      # callback token signing secret inherits FILEENGINE_JWT_SECRET (set above).
      CSAI_ONLYOFFICE_ENABLED: ${CSAI_ONLYOFFICE_ENABLED:-true}
      CSAI_ONLYOFFICE_DOCSERVER_URL: https://docs.${BASE_DOMAIN}
      CSAI_ONLYOFFICE_CALLBACK_BASE: http://csai-app:8092
      CSAI_ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET (see .env.example)}
    command: ["convert-search-ai"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8092/healthz').status==200 else 1)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # CSAI worker — consumes file events from Redis, converts + indexes (renditions
  # + pgvector). Same image, different command.
  csai-worker:
    image: fileengine-csai:${VERSION:-1.7.1}
    depends_on:
      core:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ldap-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      <<: *csai-env
    command: ["convert-search-ai-worker"]
    restart: unless-stopped

  # ONLYOFFICE Document Server — renders the in-browser office editor (Phase 1.7).
  # Self-contained: the image bundles its own postgres/rabbitmq/redis, so it does
  # NOT use our postgres/redis. Stays internal to the compose network; the browser
  # reaches it through nginx at docs.<base> (see images/nginx). CSAI signs the
  # editor config and verifies the save callback with the shared JWT_SECRET.
  onlyoffice:
    image: onlyoffice/documentserver:8.2
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET (see .env.example)}
      JWT_HEADER: Authorization
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-lib:/var/lib/onlyoffice
      - onlyoffice-logs:/var/log/onlyoffice
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck | grep -q true || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  # Model Context Protocol server (Streamable-HTTP) for AI agents. Reaches the
  # core over gRPC; per-request auth against LDAP; tenant from Host/X-Tenant.
  mcp:
    image: fileengine-mcp:${VERSION:-1.7.1}
    build:
      context: images/mcp
      dockerfile: Dockerfile
    depends_on:
      core:
        condition: service_healthy
      ldap-init:
        condition: service_completed_successfully
    environment:
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8089"
      FILEENGINE_GRPC_HOST: core
      FILEENGINE_GRPC_PORT: "50051"
      FILEENGINE_MCP_TENANT: ${DEFAULT_TENANT:-default}
      FILEENGINE_MCP_USER: ${LDAP_ADMIN_EMAIL}
      FILEENGINE_MCP_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      FILEENGINE_LDAP_ENDPOINT: ${LDAP_ENDPOINT}
      FILEENGINE_LDAP_DOMAIN: ${LDAP_DOMAIN}
      FILEENGINE_LDAP_BIND_DN: ${LDAP_BIND_DN}
      FILEENGINE_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      FILEENGINE_LDAP_TENANT_BASE: ${LDAP_TENANT_BASE}
      FILEENGINE_LDAP_USER_BASE: ${LDAP_USER_BASE}
      MCP_READ_ONLY: ${MCP_READ_ONLY:-0}
      MCP_ALLOW_DELETE: ${MCP_ALLOW_DELETE:-0}
    healthcheck:
      # /healthz rather than a bare TCP connect: the socket is accepted by the
      # listener and says nothing about whether the app behind it still serves.
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8089/healthz', timeout=3).status==200 else 1)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Discussion — document-anchored threaded comments & review. One image, four run
  # modes. The API serves the SPA's /discuss/* (threads, comments, dashboard
  # attention/activity feeds) plus the live co-viewing/comment-sync WebSocket.
  discussion:
    image: fileengine-discussion:${VERSION:-1.7.1}
    build:
      context: images/discussion
      dockerfile: Dockerfile
    depends_on:
      core:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ldap-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment: &disc-env
      DISC_HTTP_HOST: 0.0.0.0
      DISC_HTTP_PORT: "8094"
      # Accept the http-bridge bearer token — verify its signed JWTs locally via the
      # shared secret (fallback: introspection at DISC_BRIDGE_URL) — so the SPA's
      # single login also authenticates /discuss/*.
      DISC_BRIDGE_URL: http://http-bridge:8090
      FILEENGINE_JWT_SECRET: ${FILEENGINE_JWT_SECRET:?set FILEENGINE_JWT_SECRET (see .env.example)}
      FILEENGINE_GRPC_HOST: core
      FILEENGINE_GRPC_PORT: "50051"
      # Default tenant + this service's own agent identity (internal maintenance
      # only; never an ACL bypass).
      FILEENGINE_DISC_TENANT: ${DEFAULT_TENANT:-default}
      FILEENGINE_DISC_USER: ${LDAP_ADMIN_EMAIL}
      FILEENGINE_DISC_PASSWORD: ${LDAP_ADMIN_PASSWORD}
      FILEENGINE_LDAP_ENDPOINT: ${LDAP_ENDPOINT}
      FILEENGINE_LDAP_DOMAIN: ${LDAP_DOMAIN}
      FILEENGINE_LDAP_BIND_DN: ${LDAP_BIND_DN}
      FILEENGINE_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      FILEENGINE_LDAP_TENANT_BASE: ${LDAP_TENANT_BASE}
      FILEENGINE_LDAP_USER_BASE: ${LDAP_USER_BASE}
      # Its own database (per-tenant schema provisioned on demand).
      DISC_PG_HOST: ${POSTGRES_HOST:-postgres}
      DISC_PG_PORT: "${POSTGRES_PORT:-5432}"
      DISC_PG_DATABASE: ${DISC_DB:-discussion}
      DISC_PG_USER: ${POSTGRES_USER}
      DISC_PG_PASSWORD: ${POSTGRES_PASSWORD}
      FILEENGINE_REDIS_HOST: redis
      FILEENGINE_REDIS_PORT: "6379"
      FILEENGINE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      FILEENGINE_EVENTS_STREAM: ${EVENTS_STREAM:-fileengine:events}
      # Comment vector index — shares the bundled CPU Ollama with CSAI (dimension
      # matches nomic-embed-text; it fixes the pgvector column, so keep it aligned).
      DISC_EMBEDDING_PROVIDER: ${DISC_EMBEDDING_PROVIDER:-ollama}
      DISC_EMBEDDING_MODEL: ${DISC_EMBEDDING_MODEL:-nomic-embed-text}
      DISC_EMBEDDING_BASE_URL: ${DISC_EMBEDDING_BASE_URL:-http://ollama:11434/v1}
      DISC_EMBEDDING_DIMENSION: ${DISC_EMBEDDING_DIMENSION:-768}
      # Email digest (used by the discussion-digest hourly cron). Links point at the
      # SPA; SMTP is optional — unset means the digest logs instead of sending.
      DISC_SPA_BASE_URL: ${DISC_SPA_BASE_URL:-}
      DISC_DIGEST_ENABLED: ${DISC_DIGEST_ENABLED:-true}
      DISC_AI_SUMMARY_ENABLED: ${DISC_AI_SUMMARY_ENABLED:-false}
      DISC_SMTP_HOST: ${DISC_SMTP_HOST:-}
      DISC_SMTP_PORT: ${DISC_SMTP_PORT:-587}
      DISC_SMTP_USER: ${DISC_SMTP_USER:-}
      DISC_SMTP_PASSWORD: ${DISC_SMTP_PASSWORD:-}
    command: ["discussion"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; socket.create_connection(('localhost',8094),3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Discussion event consumer — projects core file events into the activity feed
  # (and prunes it on file.deleted) and evicts the READ-permission cache on
  # acl.changed / role.*. Portless; same image, different command.
  discussion-consumer:
    image: fileengine-discussion:${VERSION:-1.7.1}
    depends_on:
      core:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ldap-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      <<: *disc-env
    command: ["discuss-consumer"]
    restart: unless-stopped

  # Discussion MCP door (Streamable-HTTP) — agents read/post comments under their
  # own identity. Binds DISC_HTTP_PORT + 1 (8095). Same image.
  discussion-mcp:
    image: fileengine-discussion:${VERSION:-1.7.1}
    depends_on:
      core:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ldap-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *disc-env
    command: ["discuss-mcp-http"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; socket.create_connection(('localhost',8095),3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # Discussion digest — the DEFAULT HOURLY CRON for email digests. Runs one pass at
  # the top of each hour (digest-cron); the sender self-selects due subscriptions,
  # holds a run lock, and is idempotent per period. Same image.
  discussion-digest:
    image: fileengine-discussion:${VERSION:-1.7.1}
    depends_on:
      core:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ldap-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *disc-env
    command: ["digest-cron"]
    restart: unless-stopped

  # folder_actions — custom actions bound to a virtual folder (move on review
  # approve/reject, notify, automatic sorter, webhook, raise-a-review). One image,
  # three run modes. The API serves the SPA's /folder-actions/* admin surface
  # (bindings, action types, classifier editor, run log).
  folder-actions:
    image: fileengine-folder-actions:${VERSION:-1.7.1}
    build:
      context: images/folder-actions
      dockerfile: Dockerfile
    depends_on:
      core:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ldap-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: &fa-env
      FA_HTTP_HOST: 0.0.0.0
      FA_HTTP_PORT: "8099"
      # Accept the http-bridge bearer token — verify its signed JWTs locally via
      # the shared secret (fallback: introspection at FA_BRIDGE_URL) — so the
      # SPA's single login also authenticates /folder-actions/*.
      FA_BRIDGE_URL: http://http-bridge:8090
      FILEENGINE_JWT_SECRET: ${FILEENGINE_JWT_SECRET:?set FILEENGINE_JWT_SECRET (see .env.example)}
      FILEENGINE_GRPC_HOST: core
      FILEENGINE_GRPC_PORT: "50051"
      # The dedicated action principal (§7.5). Every core mutation an action makes
      # runs as this identity, authorized at binding time — NOT as the user whose
      # activity triggered the event. Defaults to the admin account; point it at a
      # narrower LDAP account (Move/SetMetadata on the managed folders) in prod.
      FILEENGINE_FA_TENANT: ${DEFAULT_TENANT:-default}
      FILEENGINE_FA_USER: ${FA_PRINCIPAL_USER:-${LDAP_ADMIN_EMAIL}}
      FILEENGINE_FA_PASSWORD: ${FA_PRINCIPAL_PASSWORD:-${LDAP_ADMIN_PASSWORD}}
      FILEENGINE_LDAP_ENDPOINT: ${LDAP_ENDPOINT}
      FILEENGINE_LDAP_DOMAIN: ${LDAP_DOMAIN}
      FILEENGINE_LDAP_BIND_DN: ${LDAP_BIND_DN}
      FILEENGINE_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      FILEENGINE_LDAP_TENANT_BASE: ${LDAP_TENANT_BASE}
      FILEENGINE_LDAP_USER_BASE: ${LDAP_USER_BASE}
      # Its own database (per-tenant tables provisioned in code on demand).
      FA_PG_HOST: ${POSTGRES_HOST:-postgres}
      FA_PG_PORT: "${POSTGRES_PORT:-5432}"
      FA_PG_DATABASE: ${FA_DB:-folder_actions}
      FA_PG_USER: ${POSTGRES_USER}
      FA_PG_PASSWORD: ${POSTGRES_PASSWORD}
      # Consumes the shared recognized event stream with its own consumer group.
      FILEENGINE_REDIS_HOST: redis
      FILEENGINE_REDIS_PORT: "6379"
      FILEENGINE_REDIS_PASSWORD: ${REDIS_PASSWORD}
      FILEENGINE_EVENTS_STREAM: ${EVENTS_STREAM:-fileengine:events}
      FA_EVENTS_GROUP: ${FA_EVENTS_GROUP:-folder_actions}
      # Reconcile sweep (§8) — recovers work missed during a Redis outage or past
      # stream retention by re-walking bound folders. Idempotent against the live
      # consumer, so it is safe to leave on.
      FA_RECONCILE_ENABLED: ${FA_RECONCILE_ENABLED:-true}
      FA_RECONCILE_INTERVAL_S: ${FA_RECONCILE_INTERVAL_S:-900}
      FA_RECONCILE_LOOKBACK_S: ${FA_RECONCILE_LOOKBACK_S:-86400}
      FA_RECONCILE_OVERLAP_S: ${FA_RECONCILE_OVERLAP_S:-300}
      FA_RECONCILE_MAX_FILES: ${FA_RECONCILE_MAX_FILES:-5000}
      FA_RECONCILE_MAX_DEPTH: ${FA_RECONCILE_MAX_DEPTH:-32}
      # Sorter text extraction + rendition conversion come from CSAI; the
      # raise_review action posts to the discussion service.
      FA_CSAI_BASE_URL: http://csai-app:8092
      FA_DISCUSS_BASE_URL: http://discussion:8094
      # Restrict which registered actions are active (comma-separated); empty = all.
      FA_ENABLED_ACTIONS: ${FA_ENABLED_ACTIONS:-}
      # Fernet key encrypting webhook credentials at rest. Unset degrades
      # gracefully: every other action works, storing a webhook secret errors.
      FA_SECRET_KEY: ${FA_SECRET_KEY:-}
      # Notify action. Unset FA_SMTP_HOST means notifications log instead of send.
      FA_SMTP_HOST: ${FA_SMTP_HOST:-}
      FA_SMTP_PORT: ${FA_SMTP_PORT:-587}
      FA_SMTP_USER: ${FA_SMTP_USER:-}
      FA_SMTP_PASSWORD: ${FA_SMTP_PASSWORD:-}
      FA_SMTP_FROM: ${FA_SMTP_FROM:-no-reply@${BASE_DOMAIN}}
      FA_FRONTEND_BASE_URL: ${FA_FRONTEND_BASE_URL:-}
    command: ["folder-actions"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; socket.create_connection(('localhost',8099),3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # folder_actions event worker — matches fileengine:events against the bound
  # folders and runs their actions. Portless; same image, different command.
  folder-actions-consumer:
    image: fileengine-folder-actions:${VERSION:-1.7.1}
    depends_on:
      folder-actions:
        condition: service_healthy
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *fa-env
    command: ["folder-actions-consumer"]
    restart: unless-stopped

  # folder_actions reconcile sweep — periodic catch-up for events missed during an
  # outage or dropped past the stream's retention window. Same image.
  folder-actions-reconcile:
    image: fileengine-folder-actions:${VERSION:-1.7.1}
    depends_on:
      folder-actions:
        condition: service_healthy
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *fa-env
    command: ["folder-actions-reconcile"]
    restart: unless-stopped

  # difference_service — version-to-version comparison. Builds "diff renditions"
  # (a baked PDF overlay, or a merged XKT for 3D/CAD) that the SPA's unified
  # viewer opens like any other rendition, so a comparison is just another
  # document with the same comment history behind it.
  #
  # Deliberately NO Postgres: the cache key and its invalidation live on the
  # renditions themselves, written back into core under the source file's UID.
  difference:
    image: fileengine-difference:${VERSION:-1.7.1}
    build:
      context: images/difference
      dockerfile: Dockerfile
      args:
        # "auto": install IfcOpenShell if `make stage-ifc` put RPMs in the build
        # context. IFC comparison HARD-FAILS without it (there is no geometry
        # fallback — see the Dockerfile), and the flag defaulting to off is what
        # shipped an image that could not compare a single .ifc file. Set
        # DIFF_INSTALL_IFC=1 to make a missing RPM fail the build instead.
        INSTALL_IFC: ${DIFF_INSTALL_IFC:-auto}
    depends_on:
      core:
        condition: service_healthy
      ldap-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment: &diff-env
      DIFF_HTTP_HOST: 0.0.0.0
      DIFF_HTTP_PORT: "8100"
      # Accept the http-bridge bearer token — verify its signed JWTs locally via
      # the shared secret (fallback: introspection at DIFF_BRIDGE_URL) — so the
      # SPA's single login also authenticates /diff/*.
      DIFF_BRIDGE_URL: http://http-bridge:8090
      FILEENGINE_JWT_SECRET: ${FILEENGINE_JWT_SECRET:?set FILEENGINE_JWT_SECRET (see .env.example)}
      FILEENGINE_GRPC_HOST: core
      FILEENGINE_GRPC_PORT: "50051"
      # The principal diff renditions are written as. Every comparison is still
      # authorized as the requesting user first (per-user CheckPermission); this
      # identity only owns the resulting rendition, exactly as folder_actions
      # owns the mutations its actions make.
      FILEENGINE_DIFF_TENANT: ${DEFAULT_TENANT:-default}
      FILEENGINE_DIFF_USER: ${DIFF_PRINCIPAL_USER:-${LDAP_ADMIN_EMAIL}}
      FILEENGINE_DIFF_PASSWORD: ${DIFF_PRINCIPAL_PASSWORD:-${LDAP_ADMIN_PASSWORD}}
      FILEENGINE_LDAP_ENDPOINT: ${LDAP_ENDPOINT}
      FILEENGINE_LDAP_DOMAIN: ${LDAP_DOMAIN}
      FILEENGINE_REDIS_HOST: redis
      FILEENGINE_REDIS_PORT: "6379"
      FILEENGINE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Comparison is CPU-bound and can be slow on large drawings/models; these
      # are the two knobs worth tuning per host.
      DIFF_WORKER_CONCURRENCY: ${DIFF_WORKER_CONCURRENCY:-2}
      DIFF_TIMEOUT_S: ${DIFF_TIMEOUT_S:-120}
      # MUST be non-zero for difference-reconcile. The service treats 0 (its own
      # default) as "sweep once and exit", which under `restart: unless-stopped`
      # is an endless restart loop rather than a periodic sweep.
      DIFF_RECONCILE_INTERVAL_S: ${DIFF_RECONCILE_INTERVAL_S:-900}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; socket.create_connection(('localhost',8100),3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # The event worker: builds diff renditions off fileengine:events as new versions
  # land, so a comparison is usually already cached when the user asks for it.
  difference-consumer:
    image: fileengine-difference:${VERSION:-1.7.1}
    depends_on:
      difference:
        condition: service_healthy
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *diff-env
    command: ["difference-consumer"]
    restart: unless-stopped

  # Periodic backfill — catches versions whose events were missed during an outage
  # or dropped past the stream's retention window.
  difference-reconcile:
    image: fileengine-difference:${VERSION:-1.7.1}
    depends_on:
      difference:
        condition: service_healthy
      core:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *diff-env
    command: ["difference-reconcile"]
    restart: unless-stopped

  # bcf_services — the openBIM (BCF) door: BCF-API for desktop BIM issue managers
  # and the BCF-XML (.bcfzip) import/export the SPA's markup view calls.
  #
  # An ADAPTER, not a second issue database: topics live in the discussion store
  # and the core file store. The BCF projection tables it will eventually own are
  # a later phase, and the BCF-XML endpoints are stateless — topics arrive in the
  # request body and a .bcfzip comes back — so this needs no schema today. The
  # Postgres/Redis settings are wired now so the phase that uses them is config,
  # not a compose change.
  bcf:
    image: fileengine-bcf:${VERSION:-1.7.1}
    build:
      context: images/bcf
      dockerfile: Dockerfile
    depends_on:
      core:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ldap-init:
        condition: service_completed_successfully
    environment:
      BCF_HTTP_HOST: 0.0.0.0
      BCF_HTTP_PORT: "8098"
      FILEENGINE_GRPC_HOST: core
      FILEENGINE_GRPC_PORT: "50051"
      FILEENGINE_PG_HOST: ${POSTGRES_HOST:-postgres}
      FILEENGINE_PG_PORT: "${POSTGRES_PORT:-5432}"
      FILEENGINE_PG_DATABASE: ${CORE_DB}
      FILEENGINE_PG_USER: ${POSTGRES_USER}
      FILEENGINE_PG_PASSWORD: ${POSTGRES_PASSWORD}
      FILEENGINE_REDIS_HOST: redis
      FILEENGINE_REDIS_PORT: "6379"
      FILEENGINE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # Bearer auth: the service verifies the bridge's HS256 session JWTs itself
      # with this secret, so the SPA's single login also authenticates /bcf/*.
      FILEENGINE_JWT_SECRET: ${FILEENGINE_JWT_SECRET:?set FILEENGINE_JWT_SECRET (see .env.example)}
      # The key:secret door for non-interactive desktop BCF managers (scope "bcf"),
      # verified via ldap_manager. Unset => Bearer-only, which is the safe default.
      FILEENGINE_LDAP_MANAGER_URL: http://ldap-manager:8093
      SERVICE_CRED_INTERNAL_SECRET: ${SERVICE_CRED_INTERNAL_SECRET:-${MFA_INTERNAL_SECRET:-}}
      FILEENGINE_BCF_TENANT: ${DEFAULT_TENANT:-default}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; socket.create_connection(('localhost',8098),3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # share_service — time- and use-bounded links for people OUTSIDE the tenant.
  #
  # THE ONLY SERVICE HERE WITH AN UNAUTHENTICATED SURFACE, and it is off by
  # default: SHARE_ENABLED must be set deliberately. A deployment should acquire
  # a public door by deciding to, never by upgrading into one.
  #
  # It refuses to mint or redeem anything unless the audit stream is reachable —
  # the core attributes delegated activity to the link CREATOR, so this chain is
  # the only record that an access was external. Auditing off means sharing off,
  # and /readyz reports it.
  share:
    image: fileengine-share:${VERSION:-1.7.1}
    build:
      context: images/share
      dockerfile: Dockerfile
    depends_on:
      core:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      ldap-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ldap-manager:
        condition: service_started
    environment:
      SHARE_API_HOST: 0.0.0.0
      SHARE_API_PORT: "8101"
      # Unauthenticated endpoints, so loopback-only INSIDE the container — the
      # platform convention for /healthz /readyz /poolz /metrics.
      SHARE_MONITORING_HOST: 127.0.0.1
      SHARE_MONITORING_PORT: "8102"
      # The kill switch. Off unless a deployment opts in.
      SHARE_ENABLED: ${SHARE_ENABLED:-false}
      # Which LDAP group may mint links. Administrators pass regardless — an
      # invisible group gate reads as a broken build — and the admin roles are
      # STRIPPED from the identity used at redemption, so an admin's link
      # redeems with their ordinary permissions like anyone else's.
      SHARE_LDAP_GROUP: ${SHARE_LDAP_GROUP:-share_external}
      # Verifies http-bridge bearer tokens locally with the shared secret.
      FILEENGINE_JWT_SECRET: ${FILEENGINE_JWT_SECRET:?set FILEENGINE_JWT_SECRET (see .env.example)}
      FILEENGINE_JWT_ISSUER: ${FILEENGINE_JWT_ISSUER:-fileengine-bridge}
      FILEENGINE_GRPC_HOST: core
      FILEENGINE_GRPC_PORT: "50051"
      FILEENGINE_LDAP_ENDPOINT: ${LDAP_ENDPOINT}
      FILEENGINE_LDAP_DOMAIN: ${LDAP_DOMAIN}
      FILEENGINE_LDAP_USER_BASE: ${LDAP_USER_BASE:-ou=users,${LDAP_DOMAIN}}
      FILEENGINE_LDAP_TENANT_BASE: ${LDAP_TENANT_BASE:-ou=tenants,${LDAP_DOMAIN}}
      # LDAP_BIND_DN / LDAP_BIND_PASSWORD, matching every other service —
      # LDAP_ADMIN_* is the app-admin ACCOUNT, not the directory bind, and
      # using it here resolved to a blank DN and would have failed every role
      # lookup at run time.
      FILEENGINE_LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      FILEENGINE_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD:-}
      # The recipient one-time code is issued and checked by ldap_manager, which
      # owns the token store — a code minted on one replica must be verifiable
      # on another, so it cannot live in this service's memory.
      FILEENGINE_LDAP_MANAGER_URL: http://ldap-manager:8093
      SHARE_INTERNAL_SECRET: ${SHARE_INTERNAL_SECRET:-${MFA_INTERNAL_SECRET:-}}
      # A HARD dependency, not a feature flag (see the note above).
      FILEENGINE_AUDIT_ENABLED: "true"
      FILEENGINE_REDIS_HOST: redis
      FILEENGINE_REDIS_PORT: "6379"
      FILEENGINE_REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      FILEENGINE_AUDIT_STREAM: ${FILEENGINE_AUDIT_STREAM:-fileengine:audit}
      # Creator notifications ride the stream discussion's consumer already
      # reads, so no new transport.
      FILEENGINE_EVENTS_STREAM: ${FILEENGINE_EVENTS_STREAM:-fileengine:events}
      SHARE_PG_HOST: ${POSTGRES_HOST:-postgres}
      SHARE_PG_PORT: "${POSTGRES_PORT:-5432}"
      SHARE_PG_DATABASE: ${SHARE_DB:-share_service}
      SHARE_PG_USER: ${POSTGRES_USER}
      SHARE_PG_PASSWORD: ${POSTGRES_PASSWORD}
      SHARE_DEFAULT_TENANT: ${DEFAULT_TENANT:-default}
      # The origin the /s/ landing page is served from. It goes into the URL a
      # creator copies and emails, so a wrong value is discovered by the
      # RECIPIENT. Empty falls back to the request's own origin, which is right
      # behind this nginx and wrong anywhere else.
      SHARE_PUBLIC_BASE_URL: ${SHARE_PUBLIC_BASE_URL:-}
      SHARE_RETENTION_DAYS: ${SHARE_RETENTION_DAYS:-365}
      SHARE_RETENTION_TENANTS: ${SHARE_RETENTION_TENANTS:-}
    healthcheck:
      # Probes the API port, not monitoring: monitoring is loopback-bound inside
      # the container and this runs there, but the API is what nginx fronts.
      test: ["CMD-SHELL", "python3 -c \"import socket,sys; socket.create_connection(('localhost',8101),3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # ldap-manager — tenant user/role admin API + self-service profile/password.
  # Talks LDAP (writes to the master), Postgres (email templates), Redis (invite/
  # reset tokens) and SMTP. Reached via nginx at /ldapadmin; reuses the SPA's
  # http-bridge bearer token.
  ldap-manager:
    image: fileengine-ldap-manager:${VERSION:-1.7.1}
    build:
      context: images/ldap-manager
      dockerfile: Dockerfile
    depends_on:
      ldap-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      http-bridge:
        condition: service_started
    environment:
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8093"
      # Shared FILEENGINE_LDAP_* — identical to the bridges (single-server or
      # master→replica). Writes go to the master.
      FILEENGINE_LDAP_ENDPOINT: ${LDAP_ENDPOINT}
      FILEENGINE_LDAP_ENDPOINT_REPLICA: ${LDAP_ENDPOINT_REPLICA:-}
      FILEENGINE_FAILOVER_COOLDOWN_S: ${FILEENGINE_FAILOVER_COOLDOWN_S:-30}
      FILEENGINE_LDAP_DOMAIN: ${LDAP_DOMAIN}
      FILEENGINE_LDAP_BIND_DN: ${LDAP_BIND_DN}
      FILEENGINE_LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}
      FILEENGINE_LDAP_TENANT_BASE: ${LDAP_TENANT_BASE}
      FILEENGINE_LDAP_USER_BASE: ${LDAP_USER_BASE}
      # Auth (introspect the SPA bearer token) + datastores.
      BRIDGE_URL: http://http-bridge:8090
      # Verify the bridge's signed bearer JWTs locally; must match the bridge's
      # FILEENGINE_JWT_SECRET. Also forwarded to the bridge to provision home folders.
      FILEENGINE_JWT_SECRET: ${FILEENGINE_JWT_SECRET:?set FILEENGINE_JWT_SECRET (see .env.example)}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${CSAI_DB}
      # The share-link OTP seam. share_service asks this service to issue and
      # check a recipient's one-time code, because the token store lives here:
      # a code minted on one replica must be verifiable on another, so it
      # cannot live in share_service's memory.
      #
      # THE SECRET MUST MATCH share_service's. Unset, `require_internal`
      # answers 404 ("internal share API not enabled") — which share_service
      # then reports to the recipient as the uniform "this link isn't
      # available", so the symptom is a share feature where links mint and peek
      # but no code ever arrives, with nothing pointing at this variable.
      SHARE_INTERNAL_SECRET: ${SHARE_INTERNAL_SECRET:-${MFA_INTERNAL_SECRET:-}}
      # Email / invites / reset.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      INVITE_LINK_BASE: ${INVITE_LINK_BASE:-}
      INVITE_TTL_HOURS: ${INVITE_TTL_HOURS:-72}
      RESET_LINK_BASE: ${RESET_LINK_BASE:-}
      RESET_TTL_HOURS: ${RESET_TTL_HOURS:-2}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost',8093),3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  # nginx — TLS termination, SPA serving, per-tenant subdomain routing. The ONLY
  # service that publishes host ports.
  nginx:
    image: fileengine-nginx:${VERSION:-1.7.1}
    build:
      context: images/nginx
      dockerfile: Dockerfile
    depends_on:
      http-bridge:
        condition: service_started
      csai-app:
        condition: service_started
      webdav-bridge:
        condition: service_started
      mcp:
        condition: service_started
      onlyoffice:
        condition: service_started
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      TLS_MODE: ${TLS_MODE:-selfsigned}
      HTTP_MAX_BODY_BYTES: ${HTTP_MAX_BODY_BYTES:-0}
      LE_EMAIL: ${LE_EMAIL:-}
      LE_STAGING: ${LE_STAGING:-false}
      LE_DNS_PROVIDER: ${LE_DNS_PROVIDER:-}
      # Official 389 Cockpit console at ldap-admin.<base> (off by default). When 1,
      # nginx renders the vhost with Basic auth (admin / COCKPIT_ADMIN_PASSWORD).
      ENABLE_LDAP_ADMIN: ${ENABLE_LDAP_ADMIN:-0}
      COCKPIT_ADMIN_PASSWORD: ${COCKPIT_ADMIN_PASSWORD:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
      - nginxtls:/etc/nginx/tls
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  filecache:
  ldapdata:
  ollama:
  letsencrypt:
  nginxtls:
  onlyoffice-data:
  onlyoffice-lib:
  onlyoffice-logs:
